services:
  docs:
    image: django_tenants_auth_local_docs
    container_name: django_tenants_auth_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./django_tenants_auth:/app/django_tenants_auth:z
    ports:
      - '9000:9000'
    command: /start-docs
